<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commissioning Node Map</title>
<meta name="description" content="How the commissioning screens, the Supabase bridge and api-v2 line up — one layered map with the mismatches marked.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <h1>Commissioning Node Map</h1>
  <span class="bar-sep" role="presentation"></span>

  <span class="group-label">Sheets</span>
  <span id="layer-toggles"></span>
  <label class="toggle" data-layer="gaps"><input type="checkbox" id="gaps-toggle"><span class="dot"></span>Gaps</label>

  <span class="spacer"></span>

  <button class="btn zoom" id="zoom-out" aria-label="Zoom out">−</button>
  <span class="zoom-level" id="zoom-level">100%</span>
  <button class="btn zoom" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="btn" id="fit">Fit</button>
  <button class="btn" id="tidy">Tidy up</button>
</header>

<main class="viewport" id="viewport">
  <div class="canvas" id="canvas"></div>
  <p class="hint">drag to pan · scroll to zoom · click a card to compare · Tidy up re-packs the board</p>

  <div class="scrim" id="scrim" hidden>
    <section class="window" id="window" role="dialog" aria-modal="true" aria-labelledby="window-title"></section>
  </div>
</main>

<script src="data/columns.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
